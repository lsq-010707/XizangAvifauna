<div class="overlay" id="overlay" aria-hidden="true"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Species detail" aria-hidden="true"><div class="drawerTop"><span data-i18n="detailHeading">物种记录 / SPECIES ACCOUNT</span><button type="button" class="closebtn" id="closeDrawer" aria-label="Close detail">×</button></div><div class="drawerScroll" id="detailContent"></div></aside>
<script>
'use strict';
/* The repository's Checklist.md remains the sole authoritative data source. */
const REPO='https://github.com/lsq-010707/XizangAvifauna';
const RAW='https://raw.githubusercontent.com/lsq-010707/XizangAvifauna/main/Checklist.md';
const SOURCE=REPO+'/blob/main/Checklist.md';
const $=id=>document.getElementById(id);
const STATES=['全部','确认','可能','存疑','排除','未评估','未标注'];
const STATE_COLORS={'确认':'#69b28b','可能':'#e8b760','存疑':'#d68a74','排除':'#aa6e80','未评估':'#aab5aa','未标注':'#ca725c'};
const VALID_STATUSES = new Set(['确认','可能','存疑','排除','未评估','未标注']);
const STR={zh:{navExplore:'浏览名录',heroTitle:'西藏鸟类名录',heroSubtitle:'THE AVIFAUNA OF XIZANG',totalEntries:'物种条目',confirmedEntries:'确认记录',familiesCount:'科',exploreTitle:'物种名录',rawChecklist:'原始名录 ↗',filterTitle:'筛选',reset:'重置',statusHeading:'记录状态',orderHeading:'目 Order',familyHeading:'科 Family',hasLink:'仅显示有证据链接的条目',sortSeq:'按 AviList 顺序 ↓',sortName:'按中文名排序 ↓',export:'导出 CSV',colSpecies:'物种 / SPECIES',colTaxo:'分类 / TAXONOMY',colStatus:'记录状态',colEvidence:'证据说明',loading:'正在读取 GitHub 名录…',prev:'上一页',next:'下一页',criteria:'记录标准',detailHeading:'物种详情',all:'全部状态',allOrder:'所有目',allFamily:'所有科',placeholder:'搜索物种、学名、编号或证据…',result:'符合条件的条目',entries:'条',countOf:'共',page:'第 {n} / {total} 页',noResults:'没有找到符合条件的物种',tryFilters:'尝试调整关键词或筛选条件。',noEvidence:'原始名录中尚未填写证据说明。',originalEvidence:'证据与考证说明',original:'查看 GitHub 原始条目',copyLink:'复制本条目链接',copyDone:'链接已复制',taxoTitle:'分类位置',altChinese:'《中国鸟类分类与分布名录》中文名',readError:'无法读取当前 GitHub 名录。请检查网络连接；也可尝试刷新页面。原始资料仍可通过 GitHub 查看。',warning:'部分条目未能按预期识别，建议检查原始 Markdown 格式。',loadingShort:'正在读取数据…',linkOnly:'外部证据链接',speciesUnit:'种',linkGenerated:'共享链接已复制'},en:{navExplore:'Browse checklist',heroTitle:'The Avifauna of Xizang',heroSubtitle:'西藏鸟类名录',totalEntries:'Checklist entries',confirmedEntries:'Confirmed records',familiesCount:'Families',exploreTitle:'Explore the checklist',rawChecklist:'Source checklist ↗',filterTitle:'FILTERS',reset:'Reset',statusHeading:'Record status',orderHeading:'Order',familyHeading:'Family',hasLink:'Show entries with evidence links only',sortSeq:'AviList order ↓',sortName:'Chinese name ↓',export:'Export CSV',colSpecies:'SPECIES',colTaxo:'TAXONOMY',colStatus:'STATUS',colEvidence:'EVIDENCE',loading:'Loading the source checklist…',prev:'Previous',next:'Next',criteria:'Criteria and disclaimer',detailHeading:'Species details',all:'All statuses',allOrder:'All orders',allFamily:'All families',placeholder:'Search species, scientific name, ID or evidence…',result:'Matching entries',entries:'entries',countOf:'of',page:'Page {n} of {total}',noResults:'No matching entries',tryFilters:'Try another query or update the filters.',noEvidence:'No evidence description has been entered in the source checklist.',originalEvidence:'Evidence and assessment',original:'Open original entry on GitHub',copyLink:'Copy link to entry',copyDone:'Link copied',taxoTitle:'Taxonomy',altChinese:'Alternative Chinese name',readError:'Unable to load the live source checklist. Check your connection or reload the page. The source remains available on GitHub.',warning:'Some species headings could not be parsed. Check source Markdown formatting.',loadingShort:'Loading…',linkOnly:'Linked evidence',speciesUnit:'species',linkGenerated:'Share link copied'}};
const stateLabels={zh:{'全部':'全部','确认':'确认','可能':'可能','存疑':'存疑','排除':'排除','未评估':'未评估','未标注':'未标注'},en:{'全部':'All','确认':'Confirmed','可能':'Probable','存疑':'Uncertain','排除':'Rejected','未评估':'Unassessed','未标注':'Not specified'}};
let lang='zh',allSpecies=[],filtered=[],activeStatus='全部',orderFilter='',familyFilter='',search='',linksOnly=false,sortBy='sequence',currentPage=1,activeSpecies=null,returnFocus=null;
const PAGE_SIZE=35;
const t=(key)=>STR[lang][key]||key;
const statusName=(key)=>stateLabels[lang][key]||key;
const clean=s=>String(s||'').replace(/\*\*/g,'').replace(/(?<!\w)\*(?!\w)/g,'').trim();
const norm=s=>String(s||'').toLocaleLowerCase().normalize('NFKC').replace(/\s+/g,' ');
const isValidStatus=(x)=>VALID_STATUSES.has(x);
function parseChecklist(source){
 const rows=source.replace(/\r\n/g,'\n').split('\n');let order='',family='',item=null;const items=[],unmatched=[];
 function save(){if(!item)return;const statusText=item.body.map(l=>l.trim()).find(l=>/^\*\*记录状态[：:]\*\*/.test(l))||'';const matched=statusText.match(/^\*\*记录状态[：:]\*\*\s*(\S+)?/);item.status=(matched&&isValidStatus(matched[1]))?matched[1]:'未标注';item.evidence=item.body.filter(l=>!/^[\s-]{5,}$/.test(l)&&!/^\s*\*\*记录状态[：:]\*\*/.test(l)&&!/^\s*\*\*证据说明[：:]\*\*\s*$/.test(l)).join('\n').trim();item.endLine=item.body.length?item.line+item.body.length:item.line;item.hasLink=/\]\(https?:\/\//.test(item.evidence)||/\]\((?:References|Media)\//i.test(item.evidence);delete item.body;items.push(item);item=null;}
 for(let i=0;i<rows.length;i++){
  const line=rows[i],trim=line.trim();if(/^##\s+\S/.test(trim)){save();order=trim.replace(/^##\s+/,'').trim();family='';continue;}
  if(/^###\s+\S/.test(trim)){save();family=trim.replace(/^###\s+/,'').trim();continue;}
  if(/^\*\*\s*\d+\./.test(trim)){
   const match=trim.match(/^\*\*\s*(\d+)\.\s+(.+?)\s+\*([^*]+)\*\s*[—–-]\s*(.*?)\*\*\s*$/);
   if(!match){unmatched.push({line:i+1,text:trim});continue;}
   save();item={id:match[1],name:match[2].trim(),scientific:match[3].trim(),alternative:match[4].trim(),order,family,line:i+1,body:[]};continue;
  }
  if(item)item.body.push(line);
 }
 save();return {items,unmatched};
}
function countStatuses(list){const counts=Object.fromEntries(STATES.map(x=>[x,0]));for(const s of list)counts[s.status]++;counts['全部']=list.length;return counts;}
function loadStats(){const counts=countStatuses(allSpecies);$('totalStat').textContent=counts['全部'].toLocaleString();$('confirmedStat').textContent=counts['确认'].toLocaleString();$('familiesStat').textContent=new Set(allSpecies.map(s=>s.family).filter(Boolean)).size.toLocaleString();document.querySelectorAll('.statnum').forEach(x=>x.classList.remove('loading'));}
function renderStateFilters(){const counts=countStatuses(allSpecies);const box=$('stateFilters');box.replaceChildren();for(const key of STATES){if(key==='未标注'&&!counts[key])continue;const b=document.createElement('button');b.type='button';b.className='statefilter'+(activeStatus===key?' selected':'');b.setAttribute('aria-pressed',String(activeStatus===key));const dot=document.createElement('span');dot.className='sDot';dot.style.background=STATE_COLORS[key]||'#608671';const label=document.createElement('span');label.textContent=key==='全部'?t('all'):statusName(key);const count=document.createElement('span');count.className='sCount';count.textContent=counts[key].toLocaleString();b.append(dot,label,count);b.addEventListener('click',()=>{activeStatus=key;currentPage=1;renderStateFilters();applyFilters();});box.append(b);}}
function updateSelect(sel,values,current,allLabel){sel.replaceChildren();const op=document.createElement('option');op.value='';op.textContent=allLabel;sel.append(op);values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.append(o)});sel.value=values.includes(current)?current:'';}
function updateFamilySelect(){const families=[...new Set(allSpecies.filter(s=>!orderFilter||s.order===orderFilter).map(s=>s.family).filter(Boolean))].sort((a,b)=>a.localeCompare(b));updateSelect($('familySelect'),families,familyFilter,t('allFamily'));familyFilter=$('familySelect').value;}
function updateSelects(){const orders=[...new Set(allSpecies.map(s=>s.order).filter(Boolean))];updateSelect($('orderSelect'),orders,orderFilter,t('allOrder'));updateFamilySelect();}
function applyFilters(){const needle=norm(search);filtered=allSpecies.filter(s=>(activeStatus==='全部'||s.status===activeStatus)&&(!orderFilter||s.order===orderFilter)&&(!familyFilter||s.family===familyFilter)&&(!linksOnly||s.hasLink)&&(!needle||norm([s.id,s.name,s.scientific,s.alternative,s.order,s.family,s.evidence].join(' ')).includes(needle)));
 if(sortBy==='name')filtered.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')||Number(a.id)-Number(b.id));else filtered.sort((a,b)=>Number(a.id)-Number(b.id));
 const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));currentPage=Math.min(currentPage,pages);
 $('resultCount').textContent='';const main=document.createElement('span');main.textContent=filtered.length.toLocaleString()+' '+t('entries');$('resultCount').append(main);const sub=document.createElement('span');sub.textContent=' / '+allSpecies.length.toLocaleString()+' '+(lang==='zh'?'总条目':'total');$('resultCount').append(sub);
 renderRows(pages);}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function evidenceSummary(s){return clean(s.evidence).replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\s+/g,' ').slice(0,105)||'—';}
function renderRows(pages){const list=$('list');list.replaceChildren();const start=(currentPage-1)*PAGE_SIZE;if(filtered.length===0){const block=el('div','empty');block.append(el('strong','',t('noResults')),el('div','',t('tryFilters')));list.append(block);}else{const frag=document.createDocumentFragment();for(const s of filtered.slice(start,start+PAGE_SIZE)){const row=el('button','speciesrow');row.type='button';row.setAttribute('aria-label',s.name+' '+s.scientific+', '+statusName(s.status));const title=el('div');const name=el('div','speciesName');name.append(el('small','',s.id+'.'),document.createTextNode(s.name));title.append(name,el('div','scientific',s.scientific));if(s.alternative&&s.alternative!==s.name)title.append(el('div','synonym',(lang==='zh'?'又名：':'Chinese alt: ')+s.alternative));const taxo=el('div','taxo',s.family);taxo.append(el('span','',s.order));const status=el('span','status status-'+s.status);status.append(el('span','sDot'),document.createTextNode(statusName(s.status)));const summary=el('span','evidenceSnippet',evidenceSummary(s));const arrow=el('span','chevron','›');arrow.style.fontSize='23px';row.append(title,taxo,status,summary,arrow);row.addEventListener('click',()=>openDetail(s.id,true));frag.append(row);}list.append(frag);}
 $('pagination').hidden=pages<=1;$('pageInfo').textContent=t('page').replace('{n}',currentPage).replace('{total}',pages);$('prevPage').disabled=currentPage===1;$('nextPage').disabled=currentPage===pages;}
function resolveMarkdownLink(href){href=href.trim();if(/^https?:\/\//i.test(href))return href;if(/^(References|Media)\//i.test(href)&&!href.includes('..'))return REPO+'/blob/main/'+href.split('/').map(encodeURIComponent).join('/');return null;}
function appendMarkdownText(parent,raw){const regex=/\[([^\]]+)\]\(([^)]+)\)/g;let last=0,m;while((m=regex.exec(raw))){if(m.index>last)parent.append(document.createTextNode(clean(raw.slice(last,m.index))));const url=resolveMarkdownLink(m[2]);if(url){const a=el('a','',m[1]);a.href=url;a.target='_blank';a.rel='noopener noreferrer';parent.append(a);}else parent.append(document.createTextNode(m[1]));last=regex.lastIndex;}if(last<raw.length)parent.append(document.createTextNode(clean(raw.slice(last))));}
function openDetail(id,updateURL){const s=allSpecies.find(x=>x.id===String(id));if(!s)return;activeSpecies=s;returnFocus=document.activeElement;const d=$('detailContent');d.replaceChildren();d.append(el('div','detailOrder',[s.order,s.family].filter(Boolean).join(' / ')),el('h2','detailName',s.name),el('div','detailLatin',s.scientific));if(s.alternative&&s.alternative!==s.name)d.append(el('div','detailAlt',t('altChinese')+'：'+s.alternative));const badges=el('div','detailBadges');const badge=el('span','status status-'+s.status);badge.append(el('span','sDot'),document.createTextNode(statusName(s.status)));badges.append(badge,el('span','idchip','AviList #'+s.id));d.append(badges);const section=el('section','detailSection');section.append(el('h4','',t('originalEvidence')));const evidence=el('div','evidenceText');if(s.evidence){for(const ln of s.evidence.split('\n')){if(!ln.trim())continue;const p=document.createElement('p');appendMarkdownText(p,ln);evidence.append(p)}}else evidence.append(el('p','',t('noEvidence')));section.append(evidence);d.append(section);const actions=el('div','sourceBox');const src=el('a','sourceLink');src.href=SOURCE+'#L'+s.line+'-L'+Math.max(s.line,s.endLine);src.target='_blank';src.rel='noopener noreferrer';src.append(document.createTextNode(t('original')),document.createTextNode('↗'));const copy=el('button','sourceLink');copy.type='button';copy.append(document.createTextNode(t('copyLink')),document.createTextNode('↗'));copy.addEventListener('click',async()=>{const url=location.href.split('#')[0]+'#species-'+s.id;try{await navigator.clipboard.writeText(url);copy.firstChild.textContent=t('copyDone');}catch(e){window.prompt('Copy link:',url);}});actions.append(src,copy);d.append(actions);$('overlay').classList.add('open');$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false');document.body.classList.add('no-scroll');$('closeDrawer').focus();if(updateURL&&location.hash!=='#species-'+s.id){try{history.replaceState(null,'','#species-'+s.id)}catch(e){location.hash='#species-'+s.id}}}
function closeDetail(updateURL=true){$('overlay').classList.remove('open');$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');document.body.classList.remove('no-scroll');activeSpecies=null;if(updateURL&&location.hash.startsWith('#species-')){try{history.replaceState(null,'',location.pathname+location.search+'#explore')}catch(e){location.hash='#explore'}}if(returnFocus&&returnFocus.isConnected)returnFocus.focus();}
function maybeOpenFromHash(){const m=decodeURIComponent(location.hash).match(/^#species-(\d+)$/);if(m&&allSpecies.length)openDetail(m[1],false);else if(activeSpecies&&!m)closeDetail(false);}
function applyLanguage(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));document.querySelectorAll('[data-i18n-html]').forEach(n=>{n.innerHTML=t(n.dataset.i18nHtml)});$('search').placeholder=t('placeholder');$('sortBtn').textContent=t(sortBy==='sequence'?'sortSeq':'sortName');renderStateFilters();updateSelects();applyFilters();if(activeSpecies)openDetail(activeSpecies.id,false);}
function exportCSV(){if(!filtered.length)return;const columns=['AviList_ID','Chinese_name','Scientific_name','Chinese_name_alt','Order','Family','Record_status','Evidence_text','Markdown_source_url'];const quote=value=>{let v=String(value??'').replace(/\r/g,' ').replace(/\n/g,' | ');if(/^[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};const csv='\ufeff'+[columns,...filtered.map(s=>[s.id,s.name,s.scientific,s.alternative,s.order,s.family,s.status,s.evidence,SOURCE+'#L'+s.line])].map(row=>row.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='XizangAvifauna_filtered_'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
function wire(){ $('langbtn').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';applyLanguage()});$('search').addEventListener('input',e=>{search=e.target.value;currentPage=1;$('searchClear').hidden=!search;applyFilters()});$('searchClear').addEventListener('click',()=>{$('search').value='';search='';$('searchClear').hidden=true;currentPage=1;applyFilters();$('search').focus()});$('orderSelect').addEventListener('change',e=>{orderFilter=e.target.value;familyFilter='';updateFamilySelect();currentPage=1;applyFilters()});$('familySelect').addEventListener('change',e=>{familyFilter=e.target.value;currentPage=1;applyFilters()});$('hasLinkFilter').addEventListener('change',e=>{linksOnly=e.target.checked;currentPage=1;applyFilters()});$('resetBtn').addEventListener('click',()=>{activeStatus='全部';orderFilter='';familyFilter='';search='';linksOnly=false;sortBy='sequence';currentPage=1;$('search').value='';$('searchClear').hidden=true;$('hasLinkFilter').checked=false;applyLanguage()});$('sortBtn').addEventListener('click',()=>{sortBy=sortBy==='sequence'?'name':'sequence';currentPage=1;$('sortBtn').textContent=t(sortBy==='sequence'?'sortSeq':'sortName');applyFilters()});$('exportBtn').addEventListener('click',exportCSV);$('prevPage').addEventListener('click',()=>{if(currentPage>1){currentPage--;applyFilters();$('explore').scrollIntoView({behavior:'smooth'})}});$('nextPage').addEventListener('click',()=>{if(currentPage*PAGE_SIZE<filtered.length){currentPage++;applyFilters();$('explore').scrollIntoView({behavior:'smooth'})}});$('closeDrawer').addEventListener('click',()=>closeDetail());$('overlay').addEventListener('click',()=>closeDetail());document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeSpecies)closeDetail();if(e.key==='Tab'&&activeSpecies){const focusable=[...$('drawer').querySelectorAll('button:not(:disabled),a[href]')];if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});window.addEventListener('hashchange',maybeOpenFromHash);}
async function bootstrap(){wire();const endpoints=location.protocol==='file:'?[RAW]:['./Checklist.md',RAW];let source='',err=null;for(const url of endpoints){try{const response=await fetch(url,{cache:'no-cache'});if(!response.ok)throw Error('HTTP '+response.status);source=await response.text();if(!source.includes('记录状态')||!source.includes('Anseriformes'))throw Error('Invalid checklist content');break;}catch(e){err=e;}}
 if(!source){$('errorMsg').textContent=t('readError')+' '+(err?err.message:'');$('errorMsg').style.display='block';$('list').replaceChildren(el('div','empty',t('readError')));$('resultCount').textContent=t('readError');return;}
 const parsed=parseChecklist(source);allSpecies=parsed.items;if(!allSpecies.length){$('errorMsg').textContent=t('readError');$('errorMsg').style.display='block';return;}
 if(parsed.unmatched.length){$('errorMsg').textContent=t('warning')+' ('+parsed.unmatched.length+'; source lines: '+parsed.unmatched.slice(0,8).map(x=>x.line).join(', ')+')';$('errorMsg').style.display='block';console.warn('Unparsed species headings:',parsed.unmatched);}
 loadStats();applyLanguage();maybeOpenFromHash();}
bootstrap();
</script>
